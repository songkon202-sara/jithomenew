<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#0a7ea4;--primary-dk:#065f7d;--primary-lt:#e8f6fb;
  --bg:#f2f6f9;--card:#ffffff;--text:#1a2332;--text2:#4a5568;--text3:#8a9ab0;
  --border:#e2eaf2;--shadow:0 1px 3px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.05);
  --shadow-lg:0 4px 16px rgba(0,0,0,.1),0 1px 4px rgba(0,0,0,.06);
  --red:#dc2626;--red-lt:#fef2f2;--red-bd:#fecaca;
  --yellow:#d97706;--yellow-lt:#fffbeb;--yellow-bd:#fde68a;
  --green:#059669;--green-lt:#ecfdf5;--green-bd:#a7f3d0;
  --radius:12px;--radius-sm:8px;
}
html,body{height:100%;background:var(--bg);font-family:'Sarabun',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#root{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative}
@media(min-width:960px){
  #root{max-width:100%;flex-direction:row}
  .sidebar{display:flex!important;flex-direction:column;width:240px;min-height:100vh;background:var(--card);border-right:1px solid var(--border);padding:0;flex-shrink:0}
  .sidebar-logo{padding:20px 20px 8px;border-bottom:1px solid var(--border);margin-bottom:8px}
  .sidebar-nav{flex:1;padding:8px 12px}
  .sidebar-nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:500;color:var(--text2);transition:.15s;margin-bottom:2px}
  .sidebar-nav-item:hover{background:var(--bg)}
  .sidebar-nav-item.active{background:var(--primary-lt);color:var(--primary)}
  .bottom-nav{display:none!important}
  .app-main{flex:1;min-width:0;overflow-y:auto;height:100vh}
  .app-header{position:sticky;top:0;z-index:10}
}
.app-header{background:var(--primary);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header-title{font-size:17px;font-weight:700;letter-spacing:.3px}
.header-sub{font-size:11px;opacity:.75;margin-top:1px}
.header-right{display:flex;align-items:center;gap:10px}
.notif-btn{position:relative;background:rgba(255,255,255,.15);border:none;color:#fff;width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.notif-badge{position:absolute;top:2px;right:2px;background:#ef4444;color:#fff;font-size:9px;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--primary)}
.avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer}
.app-main{flex:1;overflow-y:auto;padding-bottom:80px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:20;padding:8px 0 env(safe-area-inset-bottom,8px)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer;border:none;background:none;color:var(--text3);font-family:'Sarabun',sans-serif;font-size:10px;font-weight:500;transition:.15s}
.nav-item.active{color:var(--primary)}
.nav-item svg{width:22px;height:22px}
.page{padding:16px}
.page-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px}
.page-sub{font-size:13px;color:var(--text3);margin-bottom:16px}
/* Stat cards */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.stat-card.wide{grid-column:1/-1}
.stat-num{font-size:26px;font-weight:800;line-height:1}
.stat-label{font-size:12px;color:var(--text3);font-weight:600;white-space:normal;word-break:keep-all;line-height:1.4}
.stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
/* Group badge */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge.red{background:var(--red-lt);color:var(--red);border:1px solid var(--red-bd)}
.badge.yellow{background:var(--yellow-lt);color:var(--yellow);border:1px solid var(--yellow-bd)}
.badge.green{background:var(--green-lt);color:var(--green);border:1px solid var(--green-bd)}
.badge-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.badge.red .badge-dot{background:var(--red)}
.badge.yellow .badge-dot{background:var(--yellow)}
.badge.green .badge-dot{background:var(--green)}
/* Patient card */
.patient-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;margin-bottom:10px;border-left:4px solid transparent}
.patient-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.patient-card.red{border-left-color:var(--red)}
.patient-card.yellow{border-left-color:var(--yellow)}
.patient-card.green{border-left-color:var(--green)}
.patient-card.overdue{background:var(--red-lt)}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.pc-name{font-size:15px;font-weight:600;line-height:1.2}
.pc-village{font-size:12px;color:var(--text3);margin-top:2px}
.pc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pc-date{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px}
.pc-note{font-size:12px;color:var(--text3);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Days indicator */
.days-chip{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.days-chip.today{background:#0a7ea4;color:#fff}
.days-chip.soon{background:#fef3c7;color:#92400e}
.days-chip.upcoming{background:#d1fae5;color:#065f46}
.days-chip.overdue{background:#fee2e2;color:#991b1b}
/* Section header */
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;margin-top:4px}
.section-hd h3{font-size:14px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.section-hd .see-all{font-size:12px;color:var(--primary);font-weight:600;cursor:pointer;border:none;background:none;padding:0}
/* Today strip */
.today-strip{background:linear-gradient(135deg,#0a7ea4,#065f7d);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;color:#fff}
.today-strip h2{font-size:22px;font-weight:700}
.today-strip p{font-size:13px;opacity:.8;margin-top:2px}
.today-count{font-size:13px;background:rgba(255,255,255,.2);display:inline-block;padding:3px 10px;border-radius:20px;margin-top:8px;font-weight:600}
/* Timeline */
.tl-date-hd{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;padding:10px 0 6px;border-bottom:1px solid var(--border);margin-bottom:8px}
.tl-date-hd.today-hd{color:var(--primary)}
/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:480px){.modal-overlay{align-items:center}}
.modal-sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:20px}
@media(min-width:480px){.modal-sheet{border-radius:var(--radius);max-height:80vh}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-name{font-size:20px;font-weight:700;margin-bottom:4px}
.modal-village{font-size:14px;color:var(--text3);margin-bottom:12px}
.history-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.history-item:last-child{border-bottom:none}
.history-dot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0}
.history-date{font-size:13px;font-weight:600;color:var(--text)}
.history-note{font-size:12px;color:var(--text3);margin-top:2px}
/* Search */
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap input{width:100%;padding:10px 14px 10px 38px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:'Sarabun',sans-serif;font-size:14px;background:var(--card);outline:none;color:var(--text);transition:.15s}
.search-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(10,126,164,.1)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3)}
/* Filter chips */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filter-chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--card);color:var(--text2);transition:.15s;font-family:'Sarabun',sans-serif}
.filter-chip:hover{border-color:var(--primary);color:var(--primary)}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.filter-chip.red.active{background:var(--red);border-color:var(--red)}
.filter-chip.yellow.active{background:var(--yellow);border-color:var(--yellow)}
.filter-chip.green.active{background:var(--green);border-color:var(--green)}
/* Admin form */
.form-section{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.form-section h3{font-size:15px;font-weight:700;margin-bottom:14px;color:var(--text)}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:'Sarabun',sans-serif;font-size:14px;color:var(--text);outline:none;transition:.15s;background:var(--card)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(10,126,164,.1)}
.btn{padding:11px 20px;border-radius:var(--radius-sm);font-family:'Sarabun',sans-serif;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:.15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dk)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text2)}
.btn-block{width:100%}
/* Settings row */
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-label{font-size:14px;font-weight:500}
.settings-val{font-size:13px;color:var(--text3)}
/* Empty */
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty svg{width:48px;height:48px;margin:0 auto 12px;display:block;opacity:.4}
/* Tweaks panel */
.tweaks-panel{position:fixed;bottom:90px;right:16px;z-index:40;background:var(--card);border-radius:var(--radius);padding:16px;width:240px;box-shadow:var(--shadow-lg);border:1px solid var(--border)}
@media(min-width:960px){.tweaks-panel{bottom:20px}}
.tweaks-title{font-size:13px;font-weight:700;margin-bottom:12px;color:var(--text);display:flex;justify-content:space-between;align-items:center}
.tweak-row{margin-bottom:10px}
.tweak-row label{font-size:11px;font-weight:600;color:var(--text3);display:block;margin-bottom:4px}
.tweak-row select,.tweak-row input{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-family:'Sarabun',sans-serif;font-size:12px;color:var(--text);background:var(--card)}
/* toggle */
.toggle{position:relative;width:40px;height:22px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;background:#d1d5db;border-radius:11px;cursor:pointer;transition:.2s}
.toggle-slider::before{content:'';position:absolute;width:18px;height:18px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+.toggle-slider{background:var(--primary)}
.toggle input:checked+.toggle-slider::before{transform:translateX(18px)}
/* Sidebar (desktop) */
.sidebar{display:none}
/* Bottom nav scrollable for 6 items */
.bottom-nav{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.bottom-nav::-webkit-scrollbar{display:none}
.nav-item{min-width:64px}
/* Tab switcher */
.tab-bar{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:16px}
.tab-btn{flex:1;padding:8px 4px;border:none;background:none;border-radius:8px;font-family:'Sarabun',sans-serif;font-size:13px;font-weight:600;color:var(--text3);cursor:pointer;transition:.15s}
.tab-btn.active{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}
/* Visit card */
.visit-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:10px;border-left:4px solid var(--primary)}
.visit-card.aosomo{border-left-color:#7c3aed}
/* Checklist */
.check-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer}
.check-item:last-child{border-bottom:none}
.check-box{width:20px;height:20px;border-radius:5px;border:2px solid #94a3b8;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.check-box:hover{border-color:var(--primary)}
.check-box.checked{background:var(--primary);border-color:var(--primary)}
.check-box.checked svg{display:block}
.check-box svg{display:none;width:12px;height:12px;stroke:#fff;stroke-width:3}
.check-label{font-size:13px;color:var(--text);flex:1;line-height:1.45;word-break:keep-all;overflow-wrap:break-word}
/* Score badge */
.score-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700}
/* Scroll reveal */
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-up{animation:fadeUp .2s ease both}
</style>
</head>

// ─── DATA PROCESSING ────────────────────────────────────────
function excelToDate(s){return new Date((s-25569)*86400*1000);}
function parseGroup(g){
  if(g.includes('สีแดง'))return'red';
  if(g.includes('สีเหลือง'))return'yellow';
  if(g.includes('สีเขียว'))return'green';
  return'yellow';
}
function parseInterval(s){
  if(!s)return 30;
  if(/3\s*เดือน/.test(s))return 90;
  if(/1\s*เดือน/.test(s))return 30;
  if(/4\s*สัปดาห์?/.test(s))return 28;
  if(/3\s*สัปดาห์?/.test(s))return 21;
  if(/2\s*สัปดาห์?/.test(s))return 14;
  return 30;
}
function thDate(d){
  if(!d)return'';
  const day=d.getUTCDate(),m=d.getUTCMonth(),y=d.getUTCFullYear()+543;
  const months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return `${day} ${months[m]} ${y}`;
}
function thDateFull(d){
  if(!d)return'';
  const day=d.getUTCDate(),m=d.getUTCMonth(),y=d.getUTCFullYear()+543;
  const months=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  return `${day} ${months[m]} ${y}`;
}

const records = RAW.map((r,i)=>({
  idx:i, serial:r[0], date:excelToDate(r[0]),
  groupLabel:r[1], group:parseGroup(r[1]),
  name:r[2], village:r[3]||'', intervalStr:r[4]||'',
  interval:parseInterval(r[4]), note:r[5]||''
}));

// Build patient map from ALL records, latest serial per name
const pMap={};
records.forEach(r=>{
  if(!r.name||r.name==='ทดสอบ')return;
  if(!pMap[r.name]||r.serial>pMap[r.name].serial){
    pMap[r.name]={...r};
  }
});

const TODAY_SERIAL=46137; // April 25, 2026
const TODAY=excelToDate(TODAY_SERIAL);

function dateOnly(d){return new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));}
function diffDays(a,b){return Math.round((dateOnly(a)-dateOnly(b))/(86400*1000));}

// For each patient build nextDate = lastDate + interval
let allPatients = Object.values(pMap).map((p,i)=>{
  const nextDate = new Date(p.date.getTime()+p.interval*86400*1000);
  const history = records.filter(r=>r.name===p.name).sort((a,b)=>b.serial-a.serial);
  const daysUntil = diffDays(nextDate, TODAY);
  return {...p, id:i, nextDate, daysUntil, history};
}).sort((a,b)=>a.daysUntil-b.daysUntil);

// ─── HELPERS ────────────────────────────────────────────────
function daysChip(d){
  if(d<0)return{cls:'overdue',label:`เกินนัด ${Math.abs(d)} วัน`};
  if(d===0)return{cls:'today',label:'วันนี้'};
  if(d<=3)return{cls:'soon',label:`อีก ${d} วัน`};
  return{cls:'upcoming',label:`อีก ${d} วัน`};
}
function groupColor(g){
  if(g==='red')return'red';
  if(g==='yellow')return'yellow';
  return'green';
}
function groupLabel(g){
  if(g==='red')return'กลุ่มสีแดง';
  if(g==='yellow')return'กลุ่มสีเหลือง';
  return'กลุ่มสีเขียว';
}

// ─── PATIENTS PAGE ─────────────────────────────────────────────
function PatientsPage({patients,onSelectPatient}){
  const [q,setQ]=useState('');
  const [groupF,setGroupF]=useState('all');
  const [villageF,setVillageF]=useState('all');

  const villages=['all',...new Set(patients.map(p=>p.village).filter(Boolean).sort())];
  const filtered=useMemo(()=>patients.filter(p=>{
    if(q&&!p.name.includes(q)&&!p.village.includes(q))return false;
    if(groupF!=='all'&&p.group!==groupF)return false;
    if(villageF!=='all'&&p.village!==villageF)return false;
    return true;
  }),[patients,q,groupF,villageF]);

  return(
    <div className="page">
      <div className="page-title">ผู้ป่วยทั้งหมด</div>
      <div className="page-sub">{filtered.length} รายการ จากทั้งหมด {patients.length} ราย</div>
      <div className="search-wrap">
        <span className="search-icon">{Icons.search}</span>
        <input placeholder="ค้นหาชื่อ หรือ หมู่บ้าน..." value={q} onChange={e=>setQ(e.target.value)}/>
      </div>
      <div className="filter-row">
        {['all','red','yellow','green'].map(g=>(
          <button key={g} className={`filter-chip ${g!=='all'?g:''} ${groupF===g?'active':''}`} onClick={()=>setGroupF(g)}>
            {g==='all'?'ทั้งหมด':g==='red'?'🔴 สีแดง':g==='yellow'?'🟡 สีเหลือง':'🟢 สีเขียว'}
          </button>
        ))}
      </div>
      <div className="filter-row" style={{marginTop:-6}}>
        {villages.map(v=>(
          <button key={v} className={`filter-chip ${villageF===v?'active':''}`} onClick={()=>setVillageF(v)}>
            {v==='all'?'ทุกหมู่บ้าน':v}
          </button>
        ))}
      </div>
      {filtered.length===0?(
        <div className="empty">{Icons.users}<p>ไม่พบรายการ</p></div>
      ):(
        filtered.map(p=><PatientCard key={p.id} p={p} onClick={onSelectPatient}/>)
      )}
    </div>
  );
}

// ─── TIMELINE PAGE ─────────────────────────────────────────────
function TimelinePage({patients,onSelectPatient}){
  const upcoming=useMemo(()=>[...patients].sort((a,b)=>a.nextDate-b.nextDate),[patients]);
  const groups={};
  upcoming.forEach(p=>{
    const key=p.nextDate.toISOString().slice(0,10);
    if(!groups[key])groups[key]=[];
    groups[key].push(p);
  });
  const todayKey=TODAY.toISOString().slice(0,10);
  return(
    <div className="page">
      <div className="page-title">ตารางนัดหมาย</div>
      <div className="page-sub">เรียงตามวันนัดฉีดยา</div>
      {Object.entries(groups).map(([dateStr,pts])=>{
        const d=new Date(dateStr+'T00:00:00Z');
        const isToday=dateStr===todayKey;
        const isPast=dateStr<todayKey;
        return(
          <div key={dateStr}>
            <div className={`tl-date-hd ${isToday?'today-hd':''}`} style={{color:isPast?'var(--red)':isToday?'var(--primary)':'var(--text3)'}}>
              {isPast?'⚠️ ':isToday?'📅 ':''}{thDateFull(d)}{isToday?' — วันนี้':''}
              <span style={{marginLeft:6,background:isPast?'var(--red-lt)':isToday?'var(--primary-lt)':'var(--bg)',color:isPast?'var(--red)':isToday?'var(--primary)':'var(--text3)',padding:'1px 8px',borderRadius:20,fontSize:11}}>{pts.length} ราย</span>
            </div>
            {pts.map(p=><PatientCard key={p.id} p={p} onClick={onSelectPatient}/>)}
          </div>
        );
      })}
    </div>
  );
}

function DonutChart({red,yellow,green,size=120}){
  const total=red+yellow+green||1;
  const r=40,cx=60,cy=60,circ=2*Math.PI*r;
  const redPct=red/total,yellowPct=yellow/total,greenPct=green/total;
  const redDash=redPct*circ,yellowDash=yellowPct*circ,greenDash=greenPct*circ;
  const redOffset=0,yellowOffset=-redDash,greenOffset=-(redDash+yellowDash);
  return(
    <svg width={size} height={size} viewBox="0 0 120 120" style={{transform:'rotate(-90deg)'}}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="var(--border)" strokeWidth="16"/>
      {red>0&&<circle cx={cx} cy={cy} r={r} fill="none" stroke="#dc2626" strokeWidth="16" strokeDasharray={`${redDash} ${circ}`} strokeDashoffset={redOffset}/>}
      {yellow>0&&<circle cx={cx} cy={cy} r={r} fill="none" stroke="#d97706" strokeWidth="16" strokeDasharray={`${yellowDash} ${circ}`} strokeDashoffset={yellowOffset}/>}
      {green>0&&<circle cx={cx} cy={cy} r={r} fill="none" stroke="#059669" strokeWidth="16" strokeDasharray={`${greenDash} ${circ}`} strokeDashoffset={greenOffset}/>}
    </svg>
  );
}

function HBar({value,max,color,label,count}){
  const pct=max>0?(value/max)*100:0;
  return(
    <div style={{marginBottom:10}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
        <span style={{fontSize:13,fontWeight:500,color:'var(--text)'}}>{label}</span>
        <span style={{fontSize:13,fontWeight:700,color}}>{count} ราย</span>
      </div>
      <div style={{background:'var(--border)',borderRadius:6,height:10,overflow:'hidden'}}>
        <div style={{width:`${pct}%`,background:color,height:'100%',borderRadius:6,transition:'width .5s ease'}}/>
      </div>
    </div>
  );
}

function LineChart({records}){
  // Count appointments per month from raw records (Excel serial → month)
  const monthData={};
  records.forEach(r=>{
    if(!r.name||r.name==='ทดสอบ')return;
    const d=r.date;
    const key=`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}`;
    if(!monthData[key])monthData[key]={total:0,red:0,yellow:0,green:0};
    monthData[key].total++;
    monthData[key][r.group]++;
  });
  // Take last 9 months with data
  const sorted=Object.entries(monthData).sort((a,b)=>a[0].localeCompare(b[0]));
  const last9=sorted.slice(-9);
  if(last9.length<2)return null;

  const thMonths=['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const labels=last9.map(([k])=>{const[,m]=k.split('-');return thMonths[parseInt(m)];});
  const totals=last9.map(([,v])=>v.total);
  const reds=last9.map(([,v])=>v.red);
  const yellows=last9.map(([,v])=>v.yellow);
  const greens=last9.map(([,v])=>v.green);

  const W=320,H=130,padL=28,padR=12,padT=12,padB=28;
  const chartW=W-padL-padR,chartH=H-padT-padB;
  const maxVal=Math.max(...totals,1);
  const n=last9.length;

  function pts(arr,color){
    const points=arr.map((v,i)=>[
      padL+i*(chartW/(n-1)),
      padT+chartH-(v/maxVal)*chartH
    ]);
    const d='M'+points.map(p=>p.join(',')).join(' L');
    // area fill
    const areaD=d+` L${points[points.length-1][0]},${padT+chartH} L${points[0][0]},${padT+chartH} Z`;
    const dotId=color.replace('#','');
    return(
      <g key={color}>
        <path d={areaD} fill={color} fillOpacity="0.08" stroke="none"/>
        <path d={d} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"/>
        {points.map(([x,y],i)=>(
          <circle key={i} cx={x} cy={y} r="3.5" fill={color} stroke="#fff" strokeWidth="1.5"/>
        ))}
      </g>
    );
  }

  // Y-axis labels
  const yTicks=[0,Math.round(maxVal/2),maxVal];

  return(
    <div style={{background:'var(--card)',borderRadius:'var(--radius)',padding:16,boxShadow:'var(--shadow)',marginBottom:12}}>
      <div style={{fontWeight:700,fontSize:14,marginBottom:4,color:'var(--text)'}}>แนวโน้มการนัดหมายรายเดือน</div>
      <div style={{fontSize:12,color:'var(--text3)',marginBottom:12}}>จำนวนนัดฉีดยา จำแนกตามกลุ่มสี</div>

      {/* Legend */}
      <div style={{display:'flex',gap:14,marginBottom:10,flexWrap:'wrap'}}>
        {[['#0a7ea4','รวมทั้งหมด'],['#dc2626','สีแดง'],['#d97706','สีเหลือง'],['#059669','สีเขียว']].map(([c,l])=>(
          <div key={l} style={{display:'flex',alignItems:'center',gap:5,fontSize:11,color:'var(--text2)',fontWeight:600}}>
            <div style={{width:20,height:3,background:c,borderRadius:2}}/>
            <div style={{width:6,height:6,borderRadius:'50%',background:c}}/>
            {l}
          </div>
        ))}
      </div>

      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',overflow:'visible'}}>
        {/* Grid lines + Y labels */}
        {yTicks.map(v=>{
          const y=padT+chartH-(v/maxVal)*chartH;
          return(
            <g key={v}>
              <line x1={padL} y1={y} x2={W-padR} y2={y} stroke="var(--border)" strokeWidth="1" strokeDasharray="3,3"/>
              <text x={padL-4} y={y+4} textAnchor="end" fontSize="8" fill="var(--text3)">{v}</text>
            </g>
          );
        })}
        {/* X labels */}
        {labels.map((l,i)=>(
          <text key={i} x={padL+i*(chartW/(n-1))} y={H-4} textAnchor="middle" fontSize="9" fill="var(--text3)">{l}</text>
        ))}
        {/* Lines */}
        {pts(totals,'#0a7ea4')}
        {pts(reds,'#dc2626')}
        {pts(yellows,'#d97706')}
        {pts(greens,'#059669')}
        {/* Highlight last month */}
        <line x1={padL+(n-1)*(chartW/(n-1))} y1={padT} x2={padL+(n-1)*(chartW/(n-1))} y2={padT+chartH} stroke="var(--primary)" strokeWidth="1" strokeDasharray="4,3" strokeOpacity="0.4"/>
        <text x={padL+(n-1)*(chartW/(n-1))} y={padT-2} textAnchor="middle" fontSize="8" fill="var(--primary)" fontWeight="700">ปัจจุบัน</text>
      </svg>

      {/* Summary row */}
      <div style={{display:'flex',gap:8,marginTop:8,flexWrap:'wrap'}}>
        {last9.slice(-3).map(([k,v],i)=>{
          const[yr,m]=k.split('-');
          const label=thMonths[parseInt(m)]+' '+(parseInt(yr)+0);
          return(
            <div key={k} style={{flex:1,minWidth:80,background:'var(--bg)',borderRadius:8,padding:'8px 10px',textAlign:'center'}}>
              <div style={{fontSize:10,color:'var(--text3)',marginBottom:2}}>{label}</div>
              <div style={{fontSize:18,fontWeight:800,color:'var(--primary)'}}>{v.total}</div>
              <div style={{display:'flex',justifyContent:'center',gap:4,marginTop:3}}>
                {v.red>0&&<span style={{fontSize:9,background:'var(--red-lt)',color:'var(--red)',padding:'1px 4px',borderRadius:10,fontWeight:700}}>แดง {v.red}</span>}
                {v.yellow>0&&<span style={{fontSize:9,background:'var(--yellow-lt)',color:'var(--yellow)',padding:'1px 4px',borderRadius:10,fontWeight:700}}>เหลือง {v.yellow}</span>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ScoreColor(s,max){
  const pct=s/max;
  if(pct>=0.8)return{bg:'var(--green-lt)',color:'var(--green)',label:'ปกติดี'};
  if(pct>=0.5)return{bg:'var(--yellow-lt)',color:'var(--yellow)',label:'พอใช้'};
  return{bg:'var(--red-lt)',color:'var(--red)',label:'ต้องติดตาม'};
}

function VisitFormModal({patients,type,onClose,onSave}){
  const checklist=type==='staff'?STAFF_CHECKLIST:AOSOMO_CHECKLIST;
  const [form,setForm]=useState({patientName:'',village:'หมู่ 1',date:new Date().toISOString().slice(0,10),visitor:'',note:'',refer:false});
  const [checks,setChecks]=useState([]);
  const f=(k,v)=>setForm(p=>({...p,[k]:v}));
  const toggle=(id)=>setChecks(c=>c.includes(id)?c.filter(x=>x!==id):[...c,id]);
  const score=checks.length;
  const sc=ScoreColor(score,checklist.length);

  return(
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="modal-sheet fade-up" style={{maxHeight:'92vh'}}>

            <div style={{fontSize:12,color:'var(--text3)',marginTop:2}}>{type==='staff'?'แบบประเมินสำหรับเจ้าหน้าที่สาธารณสุข':'แบบประเมินสำหรับ อสม.'}</div>
          </div>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text3)'}}>{Icons.x}</button>

        <div className="form-group">
          <label>ชื่อผู้ป่วย</label>

            f('patientName',e.target.value);

            if(pt)f('village',pt.village);
          }} placeholder="เลือกหรือพิมพ์ชื่อ"/>
          <datalist id="visit-name-list">{patients.map(p=><option key={p.id} value={p.name}/>)}</datalist>

            <label>หมู่บ้าน</label>
            <select value={form.village} onChange={e=>f('village',e.target.value)}>

            <label>วันที่เยี่ยม</label>

        </div>
        <div className="form-group">
          <label>{type==='staff'?'ผู้ออกเยี่ยม (เจ้าหน้าที่)':'อสม. ผู้ออกเยี่ยม'}</label>
          <input type="text" value={form.visitor} onChange={e=>f('visitor',e.target.value)} placeholder={type==='staff'?'ชื่อเจ้าหน้าที่...':'ชื่อ อสม....'}/>
        </div>

          <input type="date" value={form.nextAppt||''} onChange={e=>f('nextAppt',e.target.value)}

        </div>

        <div style={{display:'flex',gap:10}}>
          <button className="btn btn-primary" style={{flex:1}} onClick={()=>{
            if(!form.patientName||!form.date)return;
            onSave({...form,type,checks,score,id:Date.now()});
          }}>บันทึกการเยี่ยม</button>
          <button className="btn btn-outline" onClick={onClose}>ยกเลิก</button>
        </div>
      </div>
    </div>
  );
}

function HomeVisitPage({patients}){
  const [tab,setTab]=useState('all');

  const [visits,setVisits]=useState(INIT_VISITS);

  const filtered=tab==='all'?visits:visits.filter(v=>v.type===tab);
  const staffCount=visits.filter(v=>v.type==='staff').length;
  const aosomoCount=visits.filter(v=>v.type==='aosomo').length;
  const referCount=visits.filter(v=>v.refer).length;

  const saveVisit=(data)=>{
    setVisits(v=>[data,...v]);
    setShowForm(null);
  };

  return(
    <div className="page">
      <div className="page-title">เยี่ยมบ้าน</div>
      <div className="page-sub">บันทึกและติดตามการเยี่ยมผู้ป่วยจิตเวช</div>

      {/* Summary */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:16}}>
        {[['ทั้งหมด',visits.length,'var(--primary)','var(--primary-lt)','📋'],['เจ้าหน้าที่',staffCount,'#0d9488','#ccfbf1','🏥'],['อสม.',aosomoCount,'#7c3aed','#ede9fe','🏡']].map(([l,n,c,bg,icon])=>(
          <div key={l} style={{background:bg,borderRadius:10,padding:'10px 12px',textAlign:'center'}}>
            <div style={{fontSize:18}}>{icon}</div>
            <div style={{fontSize:20,fontWeight:800,color:c,marginTop:2}}>{n}</div>
            <div style={{fontSize:11,color:c,fontWeight:600,opacity:.8}}>{l}</div>
          </div>
        ))}
      </div>

      {referCount>0&&(
        <div style={{background:'var(--red-lt)',border:'1px solid var(--red-bd)',borderRadius:10,padding:'10px 14px',marginBottom:14,display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:20}}>⚠️</span>
          <div><div style={{fontSize:13,fontWeight:700,color:'var(--red)'}}>มี {referCount} ราย ที่ต้องส่งต่อ/รายงานเร่งด่วน</div><div style={{fontSize:11,color:'var(--text3)'}}>กรุณาตรวจสอบและดำเนินการ</div></div>
        </div>
      )}

      {/* Action buttons */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:16}}>
        <button className="btn btn-primary" style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:'12px'}} onClick={()=>setShowForm('staff')}>
          <span style={{width:18,height:18,display:'inline-flex'}}>{Icons.clipboard}</span> เจ้าหน้าที่เยี่ยม
        </button>
        <button style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:'12px',border:'2px solid #7c3aed',background:'#faf5ff',color:'#7c3aed',borderRadius:'var(--radius-sm)',fontFamily:"'Sarabun',sans-serif",fontSize:14,fontWeight:700,cursor:'pointer'}} onClick={()=>setShowForm('aosomo')}>
          <span style={{width:18,height:18,display:'inline-flex'}}>{Icons.house}</span> อสม. เยี่ยม
        </button>
      </div>

      {/* Tab filter */}
      <div className="tab-bar">
        {[['all','ทั้งหมด'],['staff','🏥 เจ้าหน้าที่'],['aosomo','🏡 อสม.'],['refer','⚠️ ส่งต่อ']].map(([v,l])=>(
          <button key={v} className={`tab-btn ${tab===v?'active':''}`} onClick={()=>setTab(v)}>{l}</button>
        ))}
      </div>

      {/* Visit list */}
      {(tab==='refer'?visits.filter(v=>v.refer):filtered).length===0?(
        <div className="empty">{Icons.clipboard}<p style={{marginTop:8}}>ยังไม่มีรายการเยี่ยมบ้าน</p></div>
      ):(
        (tab==='refer'?visits.filter(v=>v.refer):filtered).map(v=>{
          const checklist=v.type==='staff'?STAFF_CHECKLIST:AOSOMO_CHECKLIST;
          const sc=ScoreColor(v.score,checklist.length);
          const d=new Date(v.date+'T00:00:00Z');
          return(
            <div key={v.id} className={`visit-card ${v.type==='aosomo'?'aosomo':''}`}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
                <div>
                  <div style={{fontSize:15,fontWeight:700}}>{v.patientName}</div>
                  <div style={{fontSize:12,color:'var(--text3)',marginTop:1}}>{v.village} · {thDate(d)}</div>
                </div>
                <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
                  <span style={{fontSize:11,background:v.type==='staff'?'#ccfbf1':'#ede9fe',color:v.type==='staff'?'#0d9488':'#7c3aed',padding:'2px 8px',borderRadius:20,fontWeight:700}}>
                    {v.type==='staff'?'🏥 เจ้าหน้าที่':'🏡 อสม.'}
                  </span>
                  {v.refer&&<span style={{fontSize:11,background:'var(--red-lt)',color:'var(--red)',padding:'2px 8px',borderRadius:20,fontWeight:700}}>⚠️ ส่งต่อ</span>}
                </div>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:v.note?8:0}}>
                <span className="score-badge" style={{background:sc.bg,color:sc.color,fontSize:11}}>ผล {v.score}/{checklist.length} · {sc.label}</span>
                <span style={{fontSize:12,color:'var(--text3)'}}>โดย {v.visitor}</span>
              </div>
              {v.note&&<div style={{fontSize:12,color:'var(--text2)',paddingTop:8,borderTop:'1px solid var(--border)',marginTop:4}}>{v.note}</div>}
              {/* progress bar */}
              <div style={{height:4,background:'var(--border)',borderRadius:2,marginTop:8,overflow:'hidden'}}>
                <div style={{width:`${checklist.length>0?(v.score/checklist.length*100):0}%`,height:'100%',background:sc.color,borderRadius:2}}/>
              </div>
            </div>
          );
        })
      )}

      {showForm&&<VisitFormModal patients={patients} type={showForm} onClose={()=>setShowForm(null)} onSave={saveVisit}/>}
    </div>
  );
}

function TweaksPanel({show,onClose,tweaks,setTweaks}){
  if(!show)return null;
  const t=(k,v)=>{
    const next={...tweaks,[k]:v};
    setTweaks(next);
    window.parent.postMessage({type:'__edit_mode_set_keys',edits:next},'*');
  };
  return(
    <div className="tweaks-panel">
      <div className="tweaks-title">Tweaks <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text3)',display:'flex',padding:0}}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
      <div className="tweak-row">
        <label>ชื่อโรงพยาบาล</label>
        <input type="text" value={tweaks.hospitalName} onChange={e=>t('hospitalName',e.target.value)}/>
      </div>
      <div className="tweak-row">
        <label>แสดงกลุ่ม</label>
        <select value={tweaks.defaultFilter} onChange={e=>t('defaultFilter',e.target.value)}>
          <option value="all">ทั้งหมด</option>
          <option value="red">สีแดงเท่านั้น</option>
          <option value="yellow">สีเหลืองเท่านั้น</option>
          <option value="green">สีเขียวเท่านั้น</option>
        </select>
      </div>
      <div className="tweak-row">
        <label>แจ้งเตือนล่วงหน้า (วัน)</label>
        <input type="number" min="1" max="14" value={tweaks.alertDays} onChange={e=>t('alertDays',parseInt(e.target.value)||1)}/>
      </div>
      <div className="tweak-row" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <label style={{marginBottom:0}}>Dark mode</label>
        <label className="toggle"><input type="checkbox" checked={tweaks.dark} onChange={e=>t('dark',e.target.checked)}/><span className="toggle-slider"/></label>
      </div>
    </div>
  );
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{

}/*EDITMODE-END*/;

function App(){
  const [page,setPage]=useState('dashboard');

  const [showTweaks,setShowTweaks]=useState(false);
  const [patients,setPatients]=useState(allPatients);

  useEffect(()=>{
    window.addEventListener('message',e=>{
      if(e.data?.type==='__activate_edit_mode')setShowTweaks(true);
      if(e.data?.type==='__deactivate_edit_mode')setShowTweaks(false);
    });
    window.parent.postMessage({type:'__edit_mode_available'},'*');
  },[]);

  // Apply dark mode
  useEffect(()=>{
    if(tweaks.dark){
      document.documentElement.style.setProperty('--bg','#0f172a');
      document.documentElement.style.setProperty('--card','#1e293b');
      document.documentElement.style.setProperty('--text','#f1f5f9');
      document.documentElement.style.setProperty('--text2','#94a3b8');
      document.documentElement.style.setProperty('--text3','#64748b');
      document.documentElement.style.setProperty('--border','#334155');
    } else {
      document.documentElement.style.setProperty('--bg','#f2f6f9');
      document.documentElement.style.setProperty('--card','#ffffff');
      document.documentElement.style.setProperty('--text','#1a2332');
      document.documentElement.style.setProperty('--text2','#4a5568');
      document.documentElement.style.setProperty('--text3','#8a9ab0');
      document.documentElement.style.setProperty('--border','#e2eaf2');
    }
  },[tweaks.dark]);

  const handleAddRecord=(form)=>{
    // Add to patients list dynamically
    const dateJs=new Date(form.date+'T00:00:00Z');
    const serial=Math.round(dateJs.getTime()/(86400*1000))+25569;
    const grp=form.group.includes('แดง')?'red':form.group.includes('เหลือง')?'yellow':'green';
    const interval=parseInterval(form.interval);
    const nextDate=new Date(dateJs.getTime()+interval*86400*1000);
    setPatients(prev=>{
      const existing=prev.find(p=>p.name===form.name);
      const newRec={idx:records.length,serial,date:dateJs,group:grp,groupLabel:`สุขภาพจิต กลุ่ม ${form.group}`,name:form.name,village:form.village,intervalStr:form.interval,interval,note:form.note};
      if(existing){
        return prev.map(p=>{
          if(p.name!==form.name)return p;
          const daysUntil=diffDays(nextDate,TODAY);
          return{...p,serial,date:dateJs,group:grp,intervalStr:form.interval,interval,note:form.note,nextDate,daysUntil,history:[newRec,...p.history]};
        }).sort((a,b)=>a.daysUntil-b.daysUntil);
      } else {
        const daysUntil=diffDays(nextDate,TODAY);
        const newPt={...newRec,id:prev.length,nextDate,daysUntil,history:[newRec]};
        return[...prev,newPt].sort((a,b)=>a.daysUntil-b.daysUntil);
      }
    });
  };

  const todayCount=patients.filter(p=>p.daysUntil===0).length;
  const overdueCount=patients.filter(p=>p.daysUntil<0).length;

  const navItems=[
    {id:'dashboard',label:'หน้าหลัก',icon:Icons.home},
    {id:'patients',label:'ผู้ป่วย',icon:Icons.users},
    {id:'timeline',label:'ตารางนัด',icon:Icons.calendar},
    {id:'overview',label:'ภาพรวม',icon:Icons.chart},
    {id:'visit',label:'เยี่ยมบ้าน',icon:Icons.house},
    {id:'admin',label:'แอดมิน',icon:Icons.settings},
  ];

  return(
    <>
      {/* Desktop sidebar */}
      <div className="sidebar">
        <div className="sidebar-logo">
          <div style={{fontSize:18,fontWeight:800,color:'var(--primary)'}}>JitHome</div>

        </div>
        <div className="sidebar-nav">
          {navItems.map(n=>(
            <div key={n.id} className={`sidebar-nav-item ${page===n.id?'active':''}`} onClick={()=>setPage(n.id)}>
              <span style={{width:18,height:18,display:'inline-flex'}}>{n.icon}</span>
              {n.label}
              {n.id==='dashboard'&&overdueCount>0&&<span style={{marginLeft:'auto',background:'var(--red)',color:'#fff',fontSize:10,fontWeight:700,padding:'1px 6px',borderRadius:20}}>{overdueCount}</span>}
            </div>
          ))}
        </div>
        {/* Quick shortcuts */}
        <div style={{padding:'8px 12px',display:'flex',flexDirection:'column',gap:8}}>
          <button onClick={()=>setPage('visit')} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:'linear-gradient(135deg,#ecfeff,#f0f9ff)',border:'1.5px solid rgba(10,126,164,.25)',borderRadius:10,cursor:'pointer',textAlign:'left',fontFamily:"'Sarabun',sans-serif"}}>
            <div style={{width:32,height:32,borderRadius:8,background:'var(--primary)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:16,flexShrink:0}}>🏥</div>
            <div style={{minWidth:0}}>
              <div style={{fontSize:12,fontWeight:700,color:'var(--text)'}}>เยี่ยมบ้านวันนี้</div>
              <div style={{fontSize:10,color:'var(--text3)'}}>เริ่มบันทึกเยี่ยม →</div>
            </div>
          </button>

            <div style={{width:32,height:32,borderRadius:8,background:'var(--green)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:16,flexShrink:0}}>📊</div>

        </div>
      </div>

      {/* Main content */}
      <div className="app-main">
        <div className="app-header">
          <div>
            <div className="header-title">JitHome</div>
            <div className="header-sub">{tweaks.hospitalName} · ระบบติดตามจิตเวช</div>
          </div>
          <div className="header-right">
            <button className="notif-btn" onClick={()=>setPage('timeline')}>
              {Icons.bell}
              {(todayCount+overdueCount)>0&&<span className="notif-badge">{todayCount+overdueCount}</span>}
            </button>
            <div className="avatar">อ</div>
          </div>
        </div>

        {page==='dashboard'&&<DashboardPage patients={patients} onSelectPatient={setSelected} onSelectPage={setPage}/>}
        {page==='patients'&&<PatientsPage patients={patients} onSelectPatient={setSelected}/>}
        {page==='timeline'&&<TimelinePage patients={patients} onSelectPatient={setSelected}/>}
        {page==='overview'&&<OverviewPage patients={patients}/>}
        {page==='visit'&&<HomeVisitPage patients={patients}/>}
        {page==='admin'&&<AdminPage patients={patients} onAddRecord={handleAddRecord}/>}
      </div>

      {/* Bottom nav (mobile) */}
      <nav className="bottom-nav">
        {navItems.map(n=>(
          <button key={n.id} className={`nav-item ${page===n.id?'active':''}`} onClick={()=>setPage(n.id)}>
            {n.icon}
            <span>{n.label}</span>
          </button>
        ))}
      </nav>

      {/* Patient modal */}
      {selected&&<PatientModal patient={selected} onClose={()=>setSelected(null)} onRecorded={(p,date,interval,note)=>{
        handleAddRecord({name:p.name,village:p.village,group:p.groupLabel?.replace('สุขภาพจิต กลุ่ม ','').trim()||'สีเหลือง',date,interval,note});
        setSelected(null);
      }}/>}

      {/* Tweaks */}
      <TweaksPanel show={showTweaks} onClose={()=>{setShowTweaks(false);window.parent.postMessage({type:'__edit_mode_dismissed'},'*');}} tweaks={tweaks} setTweaks={setTweaks}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
